# Il mouse lo gestisce tmux: la selezione resta dentro il pane
set -g mouse on
setw -g mode-keys vi
# Al rilascio del mouse il testo selezionato va negli appunti di macOS
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# Le window si numerano da 1 (prefix + 1 e' la prima) e restano consecutive
set -g base-index 1
set -g renumber-windows on
# Ogni window nella barra di stato e' un riquadro; i colori ANSI seguono il tema del terminale
set -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
set -g window-status-style "fg=white,bg=brightblack"
set -g window-status-current-style "fg=brightwhite,bg=blue,bold"
set -g window-status-separator " "
# La barra usa lo sfondo e il testo del tema del terminale
set -g status-style "fg=default,bg=default"
# Ogni window ha una sfumatura di sfondo propria, ricalcolata se i numeri cambiano
set-hook -g after-new-window 'run-shell "$HOME/.local/bin/tmux-window-colors"'
set-hook -g window-unlinked 'run-shell "$HOME/.local/bin/tmux-window-colors"'
set-hook -g session-created 'run-shell "$HOME/.local/bin/tmux-window-colors"'
run-shell "$HOME/.local/bin/tmux-window-colors"
